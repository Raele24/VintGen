name: Build & Release Windows App (Tauri)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag override (optional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows Installer & Portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Core Engine and Angular Web App
        run: npm run build:web

      - name: Build Tauri Windows Bundle
        run: npx tauri build

      - name: Prepare and Package Windows Artifacts
        id: vars
        shell: pwsh
        run: |
          # 1. Determine Version Tag
          if ("${{ inputs.version_tag }}" -ne "") {
            $TAG = "${{ inputs.version_tag }}"
          } elseif ("${{ github.ref }}" -match "refs/tags/") {
            $TAG = "${{ github.ref_name }}"
          } else {
            $PKG_VER = node -p "require('./package.json').version"
            $TAG = "v$PKG_VER"
          }
          echo "TAG_NAME=$TAG" >> $env:GITHUB_OUTPUT

          # 2. Locate NSIS Setup Installer (.exe)
          $nsisExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsisExe) {
            Write-Host "Found NSIS Installer: $($nsisExe.FullName)"
            Copy-Item $nsisExe.FullName "VintGen-Windows-Installer.exe"
            Copy-Item $nsisExe.FullName "VintGen-Windows-Installer-$TAG.exe"
          } else {
            Write-Error "NSIS installer not found!"
          }

          # 3. Locate Portable Standalone Executable (.exe)
          $portableExe = "src-tauri/target/release/vintgen.exe"
          if (Test-Path $portableExe) {
            Write-Host "Found Portable Binary: $portableExe"
            Copy-Item $portableExe "VintGen-Windows-Portable.exe"
            Copy-Item $portableExe "VintGen-Windows-Portable-$TAG.exe"
          } else {
            Write-Error "Portable binary not found!"
          }

          Write-Host "Prepared Windows Executables:"
          Get-ChildItem -Path "VintGen-Windows-*.exe" | Format-Table Name, Length

      - name: Upload Windows Executables as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VintGen-Windows-Artifacts
          path: VintGen-Windows-*.exe

      - name: Publish or Update GitHub Release with Windows EXEs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: VintGen ${{ steps.vars.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            VintGen-Windows-*.exe
