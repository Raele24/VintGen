[package]
name = "vintgen"
version = "1.0.0"
description = "VintGen - AI Listing Generator for Vinted and Secondhand Fashion"
authors = ["VintGen Contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
