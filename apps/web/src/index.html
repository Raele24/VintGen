<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VintGen — Universal Secondhand Listing & Pricing Engine</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Generate high-converting, search-optimized listings for online marketplaces (such as eBay, Vinted, Subito, Wallapop) in seconds. Open-source BYOK tool with AI vision, real market pricing, and instant clipboard export.">
  <meta name="keywords" content="listing generator, secondhand, resale, ebay, vinted, subito, wallapop, AI vision, gemini vision, open-source, BYOK, PWA">

  <!-- PWA & Mobile Web App Capabilities -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VintGen">
  <meta name="application-name" content="VintGen">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="msapplication-TileColor" content="#09090b">

  <!-- High-Res Brand Icons & Apple Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="mask-icon" href="/favicon.svg" color="#0ea5e9">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="VintGen — Universal Secondhand Listing & Pricing Engine">
  <meta property="og:description" content="Turn your item photos into clean marketplace listings, specs, and realistic resale prices with private BYOK AI vision.">
  <meta property="og:site_name" content="VintGen">
  <meta property="og:image" content="/icons/icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VintGen — Universal Secondhand Listing & Pricing Engine">
  <meta name="twitter:description" content="Turn your item photos into clean marketplace listings, specs, and realistic resale prices with private BYOK AI vision.">
  <meta name="twitter:image" content="/icons/icon-512.png">

  <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">

  <!-- Structured Data (JSON-LD) for SEO & PWA -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "VintGen",
    "operatingSystem": "All, Web, PWA, Windows, macOS, Android, iOS",
    "applicationCategory": "BusinessApplication",
    "description": "Open-Source AI Listing Generator for secondhand marketplaces with multi-provider vision.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "EUR"
    }
  }
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('[VintGen PWA] Service Worker registered with scope:', registration.scope);
            // Periodic update check every 45 minutes
            setInterval(() => { registration.update(); }, 45 * 60 * 1000);
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(new CustomEvent('vintgen-update-ready'));
                  }
                });
              }
            });
          })
          .catch((error) => {
            console.warn('[VintGen PWA] Service Worker registration failed:', error);
          });
      });
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
